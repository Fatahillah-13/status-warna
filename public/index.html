<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Status Warna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, Arial;
      }

      /* login card */
      .card {
        background: rgba(255, 255, 255, 0.88);
        padding: 20px;
        border-radius: 16px;
        text-align: center;
        min-width: 280px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      .btns {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      button {
        border: 0;
        padding: 12px 18px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        font-size: 16px;
      }
      .muted {
        opacity: 0.7;
        margin-top: 12px;
        font-size: 13px;
      }
      .hidden {
        display: none;
      }
      .err {
        color: #b00020;
        font-size: 13px;
        margin-top: 10px;
      }

      /* layer background yang diblink */
      #stage {
        position: fixed;
        inset: 0;
        background: #000; /* netral sebelum login */
        z-index: 0;
      }
      #stage.hidden {
        display: none;
      }

      /* pastikan login di atas stage */
      #login {
        position: relative;
        z-index: 2;
      }

      /* emoji tengah */
      #centerEmoji {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        font-size: 96px;
        opacity: 0;
        transition: opacity 150ms ease;
        text-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        z-index: 3;
      }
      #centerEmoji.show {
        opacity: 1;
      }

      /* ===== THEME ala template teman (glass + tombol kotak) ===== */

      .glass {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
      }

      .btn-sq {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        padding: 0;
      }
      .btn-sq:hover {
        transform: scale(1.06);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.28);
      }
      .btn-sq:active {
        transform: scale(0.97);
      }
      .btn-sq:focus {
        outline: none;
      }
      .btn-sq:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.65);
        outline-offset: 4px;
      }

      /* ===== USER EMOJI PANEL (kiri atas) ===== */
      #userPanel {
        position: fixed;
        left: 18px;
        top: 18px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .userRow {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .userTag {
        width: 74px;
        height: 44px;
        border-radius: 999px;
        padding: 0;
        font-weight: 800;
        letter-spacing: 0.2px;
        color: rgba(255, 255, 255, 0.92);
      }
      .userEmojiBtn {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        padding: 0;
        font-size: 26px;
        color: white;
      }

      /* ===== emoji picker popup (grid rapi) ===== */
      #emojiPicker {
        position: fixed;
        z-index: 10001;
        padding: 12px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);

        display: none;
        grid-template-columns: repeat(6, 44px);
        gap: 10px;
      }
      #emojiPicker.show {
        display: grid;
      }
      .emojiOpt {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.14);
        display: grid;
        place-items: center;
        font-size: 20px;
        transition: transform 120ms ease, background 120ms ease;
        padding: 0;
      }
      .emojiOpt:hover {
        transform: scale(1.06);
        background: rgba(255, 255, 255, 0.2);
      }
      .emojiOpt:active {
        transform: scale(0.95);
      }
      .emojiOpt.active {
        background: rgba(255, 255, 255, 0.3);
        outline: 2px solid rgba(255, 255, 255, 0.35);
        outline-offset: 2px;
      }

      /* ===== tombol warna (kiri bawah) ===== */
      .btns-corner {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }

      /* wrapper tiap tombol utama + area hover ke kanan */
      .menu {
        position: relative;
        padding-right: 220px; /* area hover ke kanan */
        margin-right: -220px; /* posisi visual tetap */
      }

      /* popup ke kanan (horizontal) */
      .submenu {
        position: absolute;
        left: 76px;
        top: 50%;
        transform: translateY(-50%);

        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: center;

        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .menu:hover .submenu {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(-50%) translateX(8px);
      }

      /* tombol utama warna (kotak) */
      .mainColorBtn {
        font-size: 22px;
        color: white;
      }

      /* tombol popup emoji (kotak lebih kecil) */
      .subColorBtn {
        width: 56px;
        height: 56px;
        font-size: 26px;
        color: white;
      }

      /* ===== MOBILE DOCK BASE ===== */
      #dockMobile.dock-hidden {
        display: none;
      }

      #dockFab {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 20000;

        width: 56px;
        height: 56px;
        border-radius: 16px;
        border: 0;
        cursor: pointer;

        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
        color: rgba(255, 255, 255, 0.92);
        font-size: 20px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);

        transition: transform 0.15s ease;
      }
      #dockFab:active {
        transform: scale(0.96);
      }

      #dockPanel {
        position: fixed;
        left: 18px;
        bottom: 86px;
        z-index: 20000;

        width: min(340px, calc(100vw - 36px));
        border-radius: 18px;

        background: rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(12px);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);

        padding: 12px;
        display: none;
      }
      #dockPanel.show {
        display: block;
      }

      #dockTabs {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .dockTab {
        flex: 1;
        border: 0;
        border-radius: 14px;
        padding: 10px 12px;
        cursor: pointer;
        font-weight: 800;

        background: rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.88);
      }
      .dockTab.active {
        background: rgba(255, 255, 255, 0.22);
        color: rgba(255, 255, 255, 0.95);
      }

      .dockContent.hidden {
        display: none;
      }

      .dockRow {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .dockSub {
        margin-top: 10px;
      }

      /* tombol warna */
      .dockBtn {
        width: 64px;
        height: 56px;
        border-radius: 16px;
        border: 0;
        cursor: pointer;
        font-size: 22px;

        display: grid;
        place-items: center;
        color: white;

        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
      }
      .dockBtn:active {
        transform: scale(0.96);
      }

      .dockBtn.g {
        background: rgba(34, 197, 94, 0.75);
      }
      .dockBtn.y {
        background: rgba(250, 204, 21, 0.78);
        color: #1f2937;
      }
      .dockBtn.r {
        background: rgba(239, 68, 68, 0.78);
      }

      /* emoji pilihan warna (submenu) */
      .dockEmojiBtn {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        border: 0;
        cursor: pointer;
        font-size: 26px;

        display: grid;
        place-items: center;

        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
      }
      .dockEmojiBtn:active {
        transform: scale(0.96);
      }

      /* USER list */
      .dockUserList {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .dockUserBtn {
        width: 100%;
        border: 0;
        cursor: pointer;
        padding: 10px 12px;
        border-radius: 16px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        background: rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.92);
      }
      .dockUserBtn:active {
        transform: scale(0.99);
      }

      .dockUserTag {
        font-weight: 900;
        letter-spacing: 0.2px;
      }
      .dockUserEmoji {
        font-size: 22px;
      }

      /* grid emoji 11 */
      .dockGrid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .dockGrid .emojiOptMobile {
        height: 44px;
        border-radius: 14px;
        border: 0;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.14);
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      .dockGrid .emojiOptMobile:active {
        transform: scale(0.96);
      }
      .dockGrid .emojiOptMobile.active {
        background: rgba(255, 255, 255, 0.26);
        outline: 2px solid rgba(255, 255, 255, 0.28);
        outline-offset: 2px;
      }

      /* ===== RESPONSIVE RULE: HP pakai dock, desktop UI disembunyikan ===== */
      @media (max-width: 640px) {
        /* sembunyikan UI desktop */
        #userPanel {
          display: none !important;
        }
        .btns-corner {
          display: none !important;
        }

        /* tampilkan dock */
        #dockMobile.dock-hidden {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage" class="hidden"></div>
    <div class="card" id="login">
      <h1>Masuk (PIN kantor)</h1>
      <input id="pin" type="password" placeholder="Masukkan PIN" />
      <div class="btns">
        <button onclick="login()">Masuk</button>
      </div>
      <div class="err" id="err"></div>
      <div class="muted">Tidak ada akun. Cukup PIN bersama.</div>
    </div>
    <div class="hidden" id="app">
      <!-- USER EMOJI STATUS (pojok kiri atas) -->
      <div id="userPanel">
        <div class="userRow">
          <button class="glass userTag" type="button">User 1</button>
          <button
            class="glass btn-sq userEmojiBtn"
            id="u1"
            type="button"
            onclick="openPicker(1, this)"
            aria-label="User 1 emoji"
          >
            🙂
          </button>
        </div>

        <div class="userRow">
          <button class="glass userTag" type="button">User 2</button>
          <button
            class="glass btn-sq userEmojiBtn"
            id="u2"
            type="button"
            onclick="openPicker(2, this)"
            aria-label="User 2 emoji"
          >
            🙂
          </button>
        </div>

        <div class="userRow">
          <button class="glass userTag" type="button">User 3</button>
          <button
            class="glass btn-sq userEmojiBtn"
            id="u3"
            type="button"
            onclick="openPicker(3, this)"
            aria-label="User 3 emoji"
          >
            🙂
          </button>
        </div>
      </div>

      <!-- popup emoji picker -->
      <div id="emojiPicker"></div>

      <!-- TOMBOL STATUS WARNA (pojok kiri bawah) -->
      <div class="btns-corner">
        <!-- HIJAU -->
        <div class="menu">
          <button
            class="glass btn-sq mainColorBtn"
            aria-label="Hijau"
            type="button"
            style="background: rgba(34, 197, 94, 0.85)"
          >
            🟢
          </button>

          <div class="submenu">
            <button
              class="glass btn-sq subColorBtn"
              aria-label="Hijau - senyum"
              onclick="pick('green','HIJAU','🚪')"
              type="button"
              style="background: rgba(34, 197, 94, 0.9)"
            >
              🚶🏻‍♂️
            </button>
            <button
              class="glass btn-sq subColorBtn"
              aria-label="Hijau - cool"
              onclick="pick('green','HIJAU','👨🏻‍💻')"
              type="button"
              style="background: rgba(22, 163, 74, 0.92)"
            >
              👨🏻‍💻
            </button>
          </div>
        </div>

        <!-- KUNING -->
        <div class="menu">
          <button
            class="glass btn-sq mainColorBtn"
            aria-label="Kuning"
            type="button"
            style="background: rgba(250, 204, 21, 0.86); color: #1f2937"
          >
            🟡
          </button>

          <div class="submenu">
            <button
              class="glass btn-sq subColorBtn"
              aria-label="Kuning - datar"
              onclick="pick('gold','KUNING','🤐')"
              type="button"
              style="background: rgba(250, 204, 21, 0.92); color: #1f2937"
            >
              🤐
            </button>
            <button
              class="glass btn-sq subColorBtn"
              aria-label="Kuning - sebal"
              onclick="pick('gold','KUNING','👀')"
              type="button"
              style="background: rgba(253, 224, 71, 0.92); color: #1f2937"
            >
              👀
            </button>
          </div>
        </div>

        <!-- MERAH -->
        <div class="menu">
          <button
            class="glass btn-sq mainColorBtn"
            aria-label="Merah"
            type="button"
            style="background: rgba(239, 68, 68, 0.88)"
          >
            🔴
          </button>

          <div class="submenu">
            <button
              class="glass btn-sq subColorBtn"
              aria-label="Merah - bahaya"
              onclick="pick('red','MERAH','‼️')"
              type="button"
              style="background: rgba(239, 68, 68, 0.92)"
            >
              ‼️
            </button>
            <button
              class="glass btn-sq subColorBtn"
              aria-label="Merah - panik"
              onclick="pick('red','MERAH','😱')"
              type="button"
              style="background: rgba(220, 38, 38, 0.92)"
            >
              😱
            </button>
          </div>
        </div>
      </div>

      <!-- ===== MOBILE FLOATING DOCK (HP) ===== -->
      <div id="dockMobile" class="dock-hidden">
        <!-- tombol floating -->
        <button id="dockFab" type="button" aria-label="Menu">☰</button>

        <!-- panel -->
        <div id="dockPanel" aria-hidden="true">
          <div id="dockTabs">
            <button type="button" class="dockTab active" data-tab="warna">
              Warna
            </button>
            <button type="button" class="dockTab" data-tab="user">User</button>
          </div>

          <!-- TAB: WARNA -->
          <div class="dockContent" id="tab-warna">
            <div class="dockRow">
              <button
                class="dockBtn g"
                type="button"
                data-color="green"
                data-label="HIJAU"
              >
                🟢
              </button>
              <button
                class="dockBtn y"
                type="button"
                data-color="gold"
                data-label="KUNING"
              >
                🟡
              </button>
              <button
                class="dockBtn r"
                type="button"
                data-color="red"
                data-label="MERAH"
              >
                🔴
              </button>
            </div>

            <!-- emoji options (muncul setelah pilih warna) -->
            <div class="dockRow dockSub" id="warnaSub"></div>
          </div>

          <!-- TAB: USER -->
          <div class="dockContent hidden" id="tab-user">
            <div class="dockUserList">
              <button class="dockUserBtn" type="button" data-user="1">
                <span class="dockUserTag">User 1</span>
                <span class="dockUserEmoji" id="mU1">🙂</span>
              </button>
              <button class="dockUserBtn" type="button" data-user="2">
                <span class="dockUserTag">User 2</span>
                <span class="dockUserEmoji" id="mU2">🙂</span>
              </button>
              <button class="dockUserBtn" type="button" data-user="3">
                <span class="dockUserTag">User 3</span>
                <span class="dockUserEmoji" id="mU3">🙂</span>
              </button>
            </div>

            <!-- grid emoji 11 (muncul setelah pilih user) -->
            <div id="userGrid" class="dockGrid hidden"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="centerEmoji"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      socket.on("connect", () => console.log("CLIENT CONNECTED", socket.id));
      socket.on("disconnect", () => console.log("CLIENT DISCONNECTED"));
      socket.on("connect_error", (e) =>
        console.log("CONNECT ERROR", e.message)
      );

      let blinkInterval = null;
      let blinkTimeout = null;
      let lastColor = "green";
      let blinkOn = false;
      let isAuthed = false;

      let lastUserEmojiState = { 1: "🙂", 2: "🙂", 3: "🙂" };
      let pickerUserId = null;

      const EMOJI_OPTIONS = [
        "💻",
        "📝",
        "🚽",
        "😴",
        "☪",
        "⚙",
        "🎥",
        "📅",
        "💊",
        "🚙",
      ]; // <-- ini daftar emoji kamu. Ganti sesuai punyamu.

      function apply({ color, emoji }) {
        if (!isAuthed) return;
        lastColor = color;
        startBlinkingFor05s();
        if (emoji) showCenterEmoji(emoji);
      }

      function startBlinkingFor05s() {
        // stop yang lama kalau ada
        if (blinkInterval) clearInterval(blinkInterval);
        if (blinkTimeout) clearTimeout(blinkTimeout);

        blinkOn = false;
        document.getElementById("stage").style.background = lastColor;

        // mulai blink putih <-> warna
        blinkInterval = setInterval(() => {
          blinkOn = !blinkOn;
          document.getElementById("stage").style.background = blinkOn
            ? "white"
            : lastColor;
        }, 300); // atur speed blink di sini

        // berhenti setelah 10 detik, lalu set ke warna terakhir
        blinkTimeout = setTimeout(() => {
          clearInterval(blinkInterval);
          blinkInterval = null;
          document.getElementById("stage").style.background = lastColor;
        }, 5000);
      }

      function pick(color, label, emoji) {
        // kirim ke server (realtime ke semua)
        socket.emit("status:set", { color, label, emoji });
      }

      function showCenterEmoji(emoji) {
        const el = document.getElementById("centerEmoji");
        el.textContent = emoji;
        el.classList.add("show");
      }

      function renderUserEmoji(state) {
        lastUserEmojiState = state || lastUserEmojiState;
        document.getElementById("u1").textContent =
          lastUserEmojiState[1] || " ";
        document.getElementById("u2").textContent =
          lastUserEmojiState[2] || " ";
        document.getElementById("u3").textContent =
          lastUserEmojiState[3] || " ";
        renderMobileUsers();
      }

      function openPicker(userId, anchorBtn) {
        pickerUserId = userId;
        const picker = document.getElementById("emojiPicker");
        const currentEmoji = lastUserEmojiState[userId];

        picker.innerHTML = EMOJI_OPTIONS.map((e) => {
          const active = e === currentEmoji ? "active" : "";
          const safe = e.replace(/'/g, "&#39;");
          return `<button class="emojiOpt ${active}" type="button" onclick="chooseEmoji('${safe}')">${e}</button>`;
        }).join("");

        const r = anchorBtn.getBoundingClientRect();
        picker.style.left = `${Math.min(
          window.innerWidth - 320,
          r.right + 10
        )}px`;
        picker.style.top = `${Math.max(18, r.top - 10)}px`;

        picker.classList.add("show");
      }

      function chooseEmoji(emoji) {
        if (!pickerUserId) return;

        // update lokal cepat (biar berasa langsung)
        lastUserEmojiState[pickerUserId] = emoji;
        renderUserEmoji(lastUserEmojiState);

        console.log("SEND useremoji:set", pickerUserId, emoji);

        // broadcast realtime ke semua
        socket.emit("useremoji:set", { userId: pickerUserId, emoji });

        closePicker();
      }

      function closePicker() {
        const picker = document.getElementById("emojiPicker");
        picker.classList.remove("show");
        pickerUserId = null;
      }

      // klik di luar picker -> tutup
      document.addEventListener("click", (e) => {
        const picker = document.getElementById("emojiPicker");
        if (!picker.classList.contains("show")) return;

        const clickedInside =
          picker.contains(e.target) ||
          e.target.classList.contains("userEmojiBtn");
        if (!clickedInside) closePicker();
      });

      function login() {
        const pin = document.getElementById("pin").value;
        document.getElementById("err").textContent = "";

        socket.emit("auth:pin", pin, (res) => {
          if (res && res.ok) {
            document.getElementById("login").classList.add("hidden");
            document.getElementById("app").classList.remove("hidden");
            document.getElementById("stage").classList.remove("hidden");
            isAuthed = true;
            socket.emit("useremoji:get");
          } else {
            document.getElementById("err").textContent = "PIN salah.";
          }
        });
      }

      // ===== MOBILE DOCK LOGIC =====
      const DOCK = {
        open: false,
        tab: "warna",
        selectedUser: null,
        selectedColor: null,
      };

      // emoji submenu untuk tiap warna (samakan dengan desktop kamu)
      const COLOR_EMOJI = {
        green: ["🚶🏻‍♂️", "👨🏻‍💻"],
        gold: ["👀", "🤐"],
        red: ["‼️", "😱"],
      };

      // update emoji di dock USER (kiri bawah)
      function renderMobileUsers() {
        const u1 = document.getElementById("mU1");
        const u2 = document.getElementById("mU2");
        const u3 = document.getElementById("mU3");
        if (!u1 || !u2 || !u3) return;
        u1.textContent = lastUserEmojiState[1] || "🙂";
        u2.textContent = lastUserEmojiState[2] || "🙂";
        u3.textContent = lastUserEmojiState[3] || "🙂";
      }

      function dockOpen() {
        DOCK.open = true;
        const panel = document.getElementById("dockPanel");
        panel.classList.add("show");
        panel.setAttribute("aria-hidden", "false");

        // default tab WARNA
        dockSetTab("warna");
        dockRenderWarnaSub(null);
        DOCK.selectedUser = null;
        dockRenderUserGrid(null);
      }

      function dockClose() {
        DOCK.open = false;
        const panel = document.getElementById("dockPanel");
        panel.classList.remove("show");
        panel.setAttribute("aria-hidden", "true");

        DOCK.selectedUser = null;
        DOCK.selectedColor = null;
      }

      function dockToggle() {
        if (DOCK.open) dockClose();
        else dockOpen();
      }

      function dockSetTab(tab) {
        DOCK.tab = tab;

        // tabs style
        document.querySelectorAll(".dockTab").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.tab === tab);
        });

        // content
        document
          .getElementById("tab-warna")
          .classList.toggle("hidden", tab !== "warna");
        document
          .getElementById("tab-user")
          .classList.toggle("hidden", tab !== "user");

        // reset sub-views
        if (tab === "warna") {
          dockRenderWarnaSub(null);
          DOCK.selectedColor = null;
        } else {
          DOCK.selectedUser = null;
          dockRenderUserGrid(null);
          renderMobileUsers();
        }
      }

      // render submenu emoji untuk warna yang dipilih
      function dockRenderWarnaSub(color) {
        const sub = document.getElementById("warnaSub");
        if (!sub) return;

        if (!color) {
          sub.innerHTML = "";
          return;
        }

        const emojis = COLOR_EMOJI[color] || [];
        sub.innerHTML = emojis
          .map(
            (e) =>
              `<button class="dockEmojiBtn" type="button" data-emoji="${e}">${e}</button>`
          )
          .join("");

        // klik emoji -> trigger pick -> auto close
        sub.querySelectorAll(".dockEmojiBtn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const emoji = btn.dataset.emoji;
            // label sesuai color
            const label =
              color === "green"
                ? "HIJAU"
                : color === "gold"
                ? "KUNING"
                : "MERAH";
            pick(color, label, emoji);
            dockClose(); // AUTO CLOSE (sesuai kamu)
          });
        });
      }

      // render grid 11 emoji untuk user yang dipilih
      function dockRenderUserGrid(userId) {
        const grid = document.getElementById("userGrid");
        if (!grid) return;

        if (!userId) {
          grid.classList.add("hidden");
          grid.innerHTML = "";
          return;
        }

        const current = lastUserEmojiState[userId];
        grid.classList.remove("hidden");
        grid.innerHTML = EMOJI_OPTIONS.map((e) => {
          const active = e === current ? "active" : "";
          return `<button class="emojiOptMobile ${active}" type="button" data-emoji="${e}">${e}</button>`;
        }).join("");

        grid.querySelectorAll(".emojiOptMobile").forEach((btn) => {
          btn.addEventListener("click", () => {
            const emoji = btn.dataset.emoji;

            // update lokal cepat
            lastUserEmojiState[userId] = emoji;
            renderMobileUsers();

            // update desktop panel juga kalau ada
            if (document.getElementById("u1")) {
              document.getElementById("u1").textContent =
                lastUserEmojiState[1] || " ";
              document.getElementById("u2").textContent =
                lastUserEmojiState[2] || " ";
              document.getElementById("u3").textContent =
                lastUserEmojiState[3] || " ";
            }

            // broadcast realtime ke semua
            socket.emit("useremoji:set", { userId, emoji });

            // AUTO CLOSE (sesuai kamu)
            dockClose();
          });
        });
      }

      // inisialisasi event dock setelah DOM siap
      window.addEventListener("DOMContentLoaded", () => {
        const fab = document.getElementById("dockFab");
        const panel = document.getElementById("dockPanel");
        if (!fab || !panel) return;

        // tombol floating
        fab.addEventListener("click", (e) => {
          e.stopPropagation();
          dockToggle();
        });

        // klik di luar panel = tutup
        document.addEventListener("click", (e) => {
          if (!DOCK.open) return;
          const inside = panel.contains(e.target) || fab.contains(e.target);
          if (!inside) dockClose();
        });

        // tabs
        document.querySelectorAll(".dockTab").forEach((btn) => {
          btn.addEventListener("click", () => dockSetTab(btn.dataset.tab));
        });

        // tombol warna utama
        document.querySelectorAll("#tab-warna .dockBtn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const color = btn.dataset.color;
            DOCK.selectedColor = color;
            dockRenderWarnaSub(color);
          });
        });

        // tombol user
        document.querySelectorAll(".dockUserBtn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const userId = Number(btn.dataset.user);
            DOCK.selectedUser = userId;
            dockRenderUserGrid(userId);
          });
        });

        // pertama kali sync tampilan
        renderMobileUsers();
      });

      // function setStatus(color, label) {
      //   socket.emit("status:set", { color, label });
      // }

      socket.on("useremoji:state", (state) => {
        // jangan gate pakai isAuthed; panel ada di #app (hidden saat belum login)
        console.log("RECEIVED useremoji:state", state);
        renderUserEmoji(state);
      });

      socket.on("status:update", apply);

      document.getElementById("pin").addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });
    </script>
  </body>
</html>
